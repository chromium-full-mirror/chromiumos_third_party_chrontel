description   "Run the CH7036 HDMI monitor"
author        "chromium-os-dev@chromium.org"

# start-user-session is only emitted from the new session_manager code.
# chromeos-xsession (the old way of starting the WM) is not run on that
# code pathway.
start on start-user-session
stop on stopping ui

# sadly, these can't reference each other.
env DATA_DIR=/home/chronos
env HOME=/home/chronos/user
env XAUTHORITY=/home/chronos/.Xauthority
env DISPLAY=:0.0

# might be overridden by --uid parameter in /sbin/session_manager_setup.sh
env USER_ID=1000

respawn
console output

script

# copied from screen-locker.conf
# TODO(sosa@chromium.org) - Temporary fix to get past race condition with
# mounting user directory.
sync
sleep 5

# Define some max.  Don't need that many for debugging.
local max_logs=5

# All logs are tagged with the date.
local log_tag=`date +%Y%m%d-%H%M%S`
local log_count=`ls -t "$HOME/log/ch7036_monitor"* | wc -l`

# Don't allow logs to grow past max log count.
if [ $log_count -ge $max_logs ] ; then
  local oldest_log=`ls -rt "$HOME/log/ch7036_monitor"* | head -1`
  rm "$oldest_log"
fi

exec /usr/bin/ch7036_monitor -v > "$HOME/log/ch7036_monitor.$log_tag"

end script

# Scripts terminate on command fail
# Should not actually start if anything in here fails
pre-start script
  test -e /usr/bin/ch7036_monitor
  /sbin/modprobe i2c-dev
  /usr/bin/ch7036_monitor -p
end script
